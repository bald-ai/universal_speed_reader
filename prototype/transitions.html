<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Folder Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d12;
      color: #e0dfe4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .folder-card {
      background: linear-gradient(145deg, #1e1a2a, #16131f);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      width: 340px;
      padding: 16px;
      overflow: hidden;
    }

    .folder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .folder-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .folder-icon { font-size: 20px; }
    .folder-name { font-weight: 600; font-size: 15px; }
    .folder-count { color: #888; font-size: 13px; }

    .folder-menu {
      color: #888; font-size: 20px; cursor: pointer;
      background: none; border: none; padding: 4px;
    }

    /* --- Carousel --- */
    .carousel-wrapper { position: relative; }

    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar { display: none; }

    .carousel-slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
      padding: 0 4px;
    }

    /* --- Book Card --- */
    .book-card {
      background: linear-gradient(160deg, rgba(120, 60, 80, 0.35), rgba(60, 30, 50, 0.5));
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 300px;
    }

    .book-cover-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .book-icon { width: 64px; height: 64px; opacity: 0.5; }

    .book-info { width: 100%; margin-top: 12px; }
    .book-title { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
    .book-author { font-size: 13px; color: #999; margin-bottom: 10px; }

    /* --- Progress --- */
    .progress-row { display: flex; align-items: center; gap: 8px; }

    .progress-bar-track {
      flex: 1; height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px; overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%; background: #a97cf8;
      border-radius: 2px; transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 12px; color: #a97cf8;
      min-width: 32px; text-align: right; font-weight: 500;
    }

    /* --- Scroll hint chevrons --- */
    .scroll-hint {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 20px; height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0.15;
      transition: opacity 0.3s ease;
      z-index: 2;
    }

    .scroll-hint.hidden { opacity: 0; }
    .scroll-hint-right { right: 0; }
    .scroll-hint-left { left: 0; }

    .scroll-hint svg {
      width: 8px; height: 16px;
      stroke: #e0dfe4; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }

    /* --- Dots --- */
    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
    }

    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: background 0.2s, transform 0.2s;
    }

    .dot.active {
      background: #a97cf8;
      transform: scale(1.3);
    }
  </style>
</head>
<body>

  <div class="folder-card">
    <div class="folder-header">
      <div class="folder-header-left">
        <span class="folder-icon">📚</span>
        <span class="folder-name">New Folder</span>
        <span class="folder-count">3</span>
      </div>
      <button class="folder-menu">⋯</button>
    </div>

    <div class="carousel-wrapper">
      <div class="scroll-hint scroll-hint-left hidden" id="hintLeft">
        <svg viewBox="0 0 8 16"><polyline points="6,2 2,8 6,14"/></svg>
      </div>
      <div class="scroll-hint scroll-hint-right" id="hintRight">
        <svg viewBox="0 0 8 16"><polyline points="2,2 6,8 2,14"/></svg>
      </div>

      <div class="carousel" id="carousel">
        <div class="carousel-slide">
          <div class="book-card">
            <div class="book-cover-area">
              <svg class="book-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 52V12a4 4 0 0 1 4-4h40v40H12a4 4 0 0 0-4 4zm0 0a4 4 0 0 0 4 4h40V48"/>
                <path d="M20 8v40"/>
              </svg>
            </div>
            <div class="book-info">
              <div class="book-title">The Bell Jar</div>
              <div class="book-author">Sylvia Plath</div>
              <div class="progress-row">
                <div class="progress-bar-track">
                  <div class="progress-bar-fill" style="width: 42%"></div>
                </div>
                <span class="progress-text">42%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-slide">
          <div class="book-card">
            <div class="book-cover-area">
              <svg class="book-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 52V12a4 4 0 0 1 4-4h40v40H12a4 4 0 0 0-4 4zm0 0a4 4 0 0 0 4 4h40V48"/>
                <path d="M20 8v40"/>
              </svg>
            </div>
            <div class="book-info">
              <div class="book-title">Norwegian Wood</div>
              <div class="book-author">Haruki Murakami</div>
              <div class="progress-row">
                <div class="progress-bar-track">
                  <div class="progress-bar-fill" style="width: 78%"></div>
                </div>
                <span class="progress-text">78%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-slide">
          <div class="book-card">
            <div class="book-cover-area">
              <svg class="book-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 52V12a4 4 0 0 1 4-4h40v40H12a4 4 0 0 0-4 4zm0 0a4 4 0 0 0 4 4h40V48"/>
                <path d="M20 8v40"/>
              </svg>
            </div>
            <div class="book-info">
              <div class="book-title">1984</div>
              <div class="book-author">George Orwell</div>
              <div class="progress-row">
                <div class="progress-bar-track">
                  <div class="progress-bar-fill" style="width: 5%"></div>
                </div>
                <span class="progress-text">5%</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="carousel-dots" id="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <script>
    const carousel = document.getElementById('carousel');
    const dots = document.querySelectorAll('.dot');
    const hintLeft = document.getElementById('hintLeft');
    const hintRight = document.getElementById('hintRight');
    const slideCount = document.querySelectorAll('.carousel-slide').length;

    function updateIndicators() {
      const slideWidth = carousel.offsetWidth;
      const activeIndex = Math.round(carousel.scrollLeft / slideWidth);

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === activeIndex);
      });

      hintLeft.classList.toggle('hidden', activeIndex === 0);
      hintRight.classList.toggle('hidden', activeIndex === slideCount - 1);
    }

    carousel.addEventListener('scroll', updateIndicators);
    updateIndicators();
  </script>

</body>
</html>
